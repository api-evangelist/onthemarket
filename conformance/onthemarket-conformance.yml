market_context: |
  This is the expected United Kingdom answer and is not a failing specific to
  OnTheMarket. The UK residential market has no MLS, no cooperative listing
  pool and therefore no certification layer at all. Interoperability between
  agency CRM systems and the portals runs on Rightmove's BLM/RTDF file and feed
  conventions, adopted by OnTheMarket and Openbrix because Rightmove's scale
  made them the default. The certified-but-unreachable pattern that the US
  sector produces cannot arise here, because there is nothing to be certified
  against.
