aid: onthemarket
name: OnTheMarket
review:
  question: What is OnTheMarket's real, publicly reachable API surface, what does a
    developer have to sign or join to use it, and what is its RESO posture?
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: portal-marketplace
  primaryDomain: onthemarket.com
  summary: |
    OnTheMarket has no public developer surface at all. Every conventional
    developer entry point was probed and none exists: developer., developers.,
    api., docs., realtime., feeds., datafeed., partner. and partners.
    onthemarket.com do not resolve; /developers, /api, /docs, /openapi.json,
    /swagger.json, /api-docs, /$metadata and /.well-known/openid-configuration
    all return HTTP 404 on www.onthemarket.com. There is no documentation site,
    no sandbox, no signup form, no SDK, no Postman collection, no changelog and
    no status page.

    What does exist is a real, live, member-only integration host. The
    OnTheMarket Real Time Datafeed (RTDF) is served from
    realtime-api.onthemarket.com — the host resolves to three AWS eu-west-1
    addresses and presents a genuine OnTheMarket TLS certificate (subject
    C=GB, L=Aldershot, O=Agents' Mutual Limited, CN=*.onthemarket.com, issued
    by DigiCert, valid 2026-01-15 to 2027-02-15). Every path on it returns
    HTTP 404 with Content-Length 0 to an anonymous caller, including the one
    endpoint whose path is publicly known from a third-party CRM vendor's
    setup instructions, /v1/property/getbranchemails. There is no contract to
    harvest — no OpenAPI, no Swagger, no WSDL, no OData $metadata — because
    OnTheMarket's developer guide is distributed under agreement rather than
    published.

    The one incidental machine-readable surface on OnTheMarket infrastructure
    is not a product API at all: expert.onthemarket.com is a WordPress site
    with its default WP REST API left open (HTTP 200, 17 namespaces, 276
    routes). It describes the marketing CMS, not property data, and is
    excluded from apis[] for that reason.

resoPosture:
  certified: false
  posture: No RESO reference found anywhere on OnTheMarket's properties. RESO is a
    North American (NAR/MLS) construct and the United Kingdom has no MLS to
    certify against, so there is no certification layer in this market at all.
  webApiCertification: none found
  dataDictionaryCertification: none found
  dataDictionaryVersion: null
  directoryEvidence: |
    https://www.reso.org/certificates/ was fetched anonymously (HTTP 200) and a
    case-insensitive grep for "onthemarket" and "united kingdom" returned zero
    matches. https://certification.reso.org/ returned HTTP 400 to an anonymous
    client and served no directory content (1,312-byte error body, zero matches
    for onthemarket). No RESO certification claim appears on onthemarket.com,
    expert.onthemarket.com, or in any OnTheMarket press material reviewed.
  odataEndpoint: none
  metadataDocument: |
    Probed https://www.onthemarket.com/$metadata (HTTP 404) and
    https://realtime-api.onthemarket.com/$metadata (HTTP 404). No OData service
    document or $metadata exists. The RTDF is not OData — it is a
    Rightmove-derived HTTP feed format, and UK portal bulk listing exchange
    otherwise runs on the Rightmove V3 BLM flat-file convention, which is not a
    formal standard and has no certification body behind it.
  universalPropertyIdentifier: |
    No UPI. OnTheMarket identifies listings with its own opaque numeric property
    identifiers in consumer URLs (/properties/<id>/) and, in the RTDF, with
    agent-side branch and property references inherited from the Rightmove ADF
    field model. Nothing maps to a RESO Universal Property Identifier.
  marketNote: |
    This is the expected UK answer and is not a failing. The UK has no MLS and
    therefore nothing for RESO to certify. Residential listings are controlled
    by two dominant portals — Rightmove and Zoopla, with OnTheMarket third —
    and reach them through agency CRM software (Reapit, Alto/Jupix, Street,
    Apex27, Dezrez) rather than a shared cooperative pool. The distinction the
    US sector forces — certified but unreachable — cannot arise here, because
    there is no certification to be had. The honest UK statement is: no
    standard, no certification, and no public contract; the only interoperable
    convention is a de facto one, the Rightmove BLM/RTDF format that
    OnTheMarket and Openbrix also accept.

accessGate:
  gate: membership-required
  gated: true
  selfServe: false
  whatYouMustSignOrJoin: |
    You must be an OnTheMarket member estate agent, homebuilder or developer
    with a listing agreement, or the CRM software vendor integrating on that
    member's behalf. There is no developer programme, no API terms page, no
    application form and no key self-issuance anywhere on any OnTheMarket
    property. Membership is arranged commercially through
    https://expert.onthemarket.com/join-us/, and data feeds are set up by
    OnTheMarket support: the OnTheMarket Expert site's only published route for
    integration is "If you have any questions relating to OnTheMarket Expert,
    data-feeds or other technical issues, get in touch with our support team",
    with support@onthemarket.com and 0808 1202 877 as the contacts. Once a feed
    is in place, the vendor connects to the RTDF host with a client certificate
    over TLS, following the OnTheMarket API Developer Guide, which is supplied
    to integrators rather than published.
  credentialIssuance: |
    Not observable publicly. No token endpoint, no client registration, no
    OAuth metadata and no OIDC discovery document are served on any
    onthemarket.com host. Credentialing happens inside the member relationship.
  publicTermsProhibitProgrammaticAccess: |
    OnTheMarket's Terms of Use are unusually explicit and are themselves part
    of the gate. Clause 3.3: "You must not use or attempt to use any automated
    program (including, without limitation, any spider or other web crawler) to
    access our system or this Site, or to search, display or obtain links to
    any part of this Site, other than the home page at www.onthemarket.com
    unless the automated program identifies itself uniquely in the User Agent
    field and is fully compliant with the Robots Exclusion Protocol (a
    'Permitted Program'). Any such use or attempted use of an automated program
    (other than a Permitted Program) shall be a misuse of our system and this
    Site." Source: https://www.onthemarket.com/terms/ (HTTP 200). The legal
    entity named there is Agents' Mutual Limited, company number 08381458, VAT
    GB510508239, a wholly owned subsidiary of OnTheMarket Limited (company
    number 10887621).
  undocumentedInternalEndpoint: |
    Recorded for completeness and deliberately NOT listed as an API. The
    consumer site's Next.js front end is backed by an internal JSON endpoint,
    https://www.onthemarket.com/async/search/properties/, which returns HTTP
    200 with application/json to an anonymous request. It is undocumented,
    unversioned, unsupported, subject to change without notice, and using it
    programmatically is precisely what clause 3.3 forbids. It is not a
    developer surface and is not represented as one.
  incidentalWordPressApi: |
    https://expert.onthemarket.com/wp-json/ returns HTTP 200 with the default
    WordPress REST API discovery document — 17 namespaces (wp/v2, yoast/v1,
    forminator/v1, divi/v1, hub-connector/v1 and others) across 276 routes,
    on a WP Engine-hosted marketing site. Real and publicly callable, but it
    is CMS infrastructure, not an OnTheMarket product API, so it is excluded
    from apis[].

openData:
  publishesOpenData: false
  note: |
    OnTheMarket publishes no open, unlicensed, publicly callable dataset. Its
    consumer data products — sold prices (/sold-prices/, /uk-house-prices/) and
    the free instant valuation AVM (/instant-valuation/, /property-valuation/),
    the latter built with Property Price Advice and recalculated monthly by
    OnTheMarket's econometrics team — are rendered as web pages for consumers,
    not exposed as data. There is no bulk download and no licence page.
  ukOpenLayerSitsElsewhere: |
    The genuinely open UK property layer belongs to the public sector, not to
    the portals: HM Land Registry Price Paid Data and ownership data under the
    Open Government Licence, and Ordnance Survey's open addressing and mapping
    products. This is the inverse of the US arrangement — the UK has no
    industry standard and no cooperative, but it does have real open government
    property APIs, and none of them come from OnTheMarket, Rightmove or Zoopla.
    OnTheMarket's sold-price pages are downstream consumers of that public
    data; they are not a republication of it under an open licence.

authModel:
  scheme: |
    Not published. Consistent with the Rightmove RTDF lineage the connection is
    mutual-TLS with a client certificate rather than a bearer token: third-party
    CRM integrators are told their servers must support TLS 1.1/1.2 and be able
    to make requests with SHA-1 PEM certificates, and the Rightmove ADF model
    the OnTheMarket guide is derived from issues a private key plus X.509
    certificate and a Network ID scoping which branches a feed may amend.
    OnTheMarket's own certificate and identifier issuance process is not
    documented publicly and could not be verified anonymously.
  apiKeys: none published
  oauth2: none published
  openidConnect: |
    Probed https://www.onthemarket.com/.well-known/openid-configuration
    anonymously — HTTP 404. No OIDC discovery document is served on any
    OnTheMarket host. The member area at https://expert.onthemarket.com/apps/login
    (HTTP 200) is a human login, not an authorization server.
  samlOrSso: none observed on any public host
  confidence: |
    Medium on the transport (mutual TLS) — inferred from the documented
    Rightmove RTDF lineage plus CRM-vendor integration notes, not from an
    OnTheMarket-published document. Low on any detail beyond that. Nothing here
    should be treated as a verified OnTheMarket auth specification.

apiFamily:
  segmentationUsedByOnTheMarketItself:
    - Property search — for sale and to rent (/for-sale/, /to-rent/)
    - Sold prices and house price data (/sold-prices/, /uk-house-prices/)
    - Instant valuation / AVM (/instant-valuation/, /property-valuation/)
    - New homes and developers (/new-homes/, /new-homes/developers/)
    - Specialist segments — retirement, student, farms/estates/land
    - Commercial property (/for-sale/commercial/, /to-rent/commercial/),
      partnered with sister CoStar brand LoopNet UK (loopnet.co.uk)
    - Agent directory and member tools (OnTheMarket Expert)
  whichOfThoseHaveAnApi: |
    None of them, publicly. Every one of these is a consumer web surface. The
    only API-shaped product OnTheMarket operates is the inbound/outbound member
    data feed (RTDF) plus branch enquiry retrieval, and that is not documented
    publicly.
  listingsSearch: no public API
  propertyRecords: no public API
  valuationAVM: |
    A real AVM exists — developed exclusively for OnTheMarket in partnership
    with Property Price Advice, recalculated monthly — but it is delivered only
    as a consumer web tool. No API, no pricing page, no partner documentation.
  transactions: not offered
  documents: not offered
  tenancy: |
    Formerly in scope and now gone. OnTheMarket acquired Teclet in 2021 and
    relaunched it as OnTheMarket Software (TecCRM, TecLet, TecHub) — a lettings
    and sales CRM with pre-tenancy and property-management workflow. CoStar
    announced its closure in October 2024 and the division ceased operations on
    30 June 2025. software.onthemarket.com no longer resolves. Any integration
    surface that division had is dead.
  payments: not offered

harvest:
  fetchDate: '2026-07-26'
  specsHarvested: 0
  openapiDirectory: null
  note: |
    Nothing was saved to openapi/ because nothing real was found. No OpenAPI,
    Swagger, RAML, WSDL, GraphQL schema, AsyncAPI or OData $metadata document
    is served from any OnTheMarket host. The openapi/ directory is deliberately
    omitted rather than created empty.

