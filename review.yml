webhooksEventsSdksPostman:
  webhooks: |
    None published. The RTDF's enquiry delivery is pull-based — CRM vendors
    poll /v1/property/getbranchemails for branch enquiries — which is the
    inverse of a webhook. No callback registration surface is documented.
  events: No event bus, no streaming, no AsyncAPI document, no WebSocket surface.
  sdks: None. No official client libraries in any language. What exists on
    GitHub, npm and PyPI under the OnTheMarket name is third-party scraping
    tooling built against the consumer site, which the Terms of Use forbid.
  postman: No official Postman collection or public workspace found.
  changelog: None published.
  statusPage: None. status.onthemarket.com does not resolve.
  rateLimits: Not documented anywhere.
  sandbox: None.

corporateContext:
  founded: 2013, by a group of estate agents, as Agents' Mutual Limited
  listing: Listed on AIM as OnTheMarket plc
  acquisition: |
    CoStar Group announced a recommended cash offer of 110p per share on
    2023-10-19, valuing OnTheMarket at approximately GBP 99 million, and
    completed the acquisition on 2023-12-12 with over 97% shareholder support
    by value. OnTheMarket is now a wholly owned CoStar Group business.
  divestments: |
    OnTheMarket Software (formerly Teclet, acquired 2021; brands TecCRM,
    TecLet, TecHub) was announced for closure in October 2024 and ceased
    operations on 30 June 2025.
  siblingBrands: |
    Within CoStar Group, UK commercial listings run through LoopNet UK
    (loopnet.co.uk), which OnTheMarket's commercial section links to directly.
  whyItMattersForApiPosture: |
    CoStar ownership matters because the parent is a US data company that does
    operate large licensed data products. None of that has surfaced as a public
    OnTheMarket developer programme. Two and a half years after acquisition,
    OnTheMarket's API posture is unchanged: member feeds only, nothing public.

findings:
  - No public developer portal exists, in any form, on any OnTheMarket host.
    This is not a portal that was retired; there is no evidence one ever existed.
  - The RTDF host realtime-api.onthemarket.com is genuinely live and genuinely
    OnTheMarket's, proven by its TLS certificate, and it answers every
    anonymous request with a bare 404. A real API with a zero-byte public
    footprint is the defining shape of this sector outside the US.
  - Zero machine-readable contracts were harvestable. The OnTheMarket API
    Developer Guide exists but is distributed to integrators under agreement,
    not published at a URL.
  - Absence is the finding across the board - no RESO, no OData, no UPI, no
    OpenAPI, no SDKs, no Postman, no webhooks, no changelog, no status page,
    no rate limits, no sandbox, no OIDC discovery, no security.txt.
  - OnTheMarket goes further than its rivals in closing the door - its Terms of
    Use clause 3.3 prohibits automated access to every page except the home
    page, which makes even the undocumented /async/ JSON endpoint off limits.
  - The interoperability that does exist in this market is a de facto
    convention, not a standard - the Rightmove BLM/RTDF format, which
    OnTheMarket and Openbrix adopted because Rightmove's scale made it the
    default. There is no governing body, no certification and no version
    registry behind it.
  - The UK inverts the US arrangement exactly as expected. The US has a
    mandated machine-readable contract (RESO) guarding licensed private data.
    The UK has no standard and no certification for private listings, but real
    open government property data from HM Land Registry and Ordnance Survey.
    OnTheMarket sits entirely on the closed side of that split.

