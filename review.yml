  apisListed: 1
  specsHarvested: 0
  openapiDirectory: null
  status: built-stub
  reason: |
    Identity captured in full and the real member-only API host evidenced and
    recorded, but there is no public developer portal and no machine-readable
    contract to harvest. Classified built-stub rather than built because
    nothing on this provider is reachable by a developer without an
    OnTheMarket agent membership and a data-feed agreement.
