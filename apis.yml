name: OnTheMarket
kind: company
description: >-
  OnTheMarket is the third-largest residential property portal in the United
  Kingdom, operating onthemarket.com. It was founded in 2013 by Agents' Mutual
  Limited as an agent-owned challenger to Rightmove and Zoopla, listed on AIM as
  OnTheMarket plc, and was acquired outright by CoStar Group in December 2023 for
  approximately GBP 99 million. In a market with no MLS and no cooperative
  listing standard, OnTheMarket sits at the demand end of the value chain:
  consumers search the portal, and listings arrive from member estate agents'
  CRM systems rather than from a shared data pool. Its API posture is honest and
  narrow. There is no public developer portal — developer., developers., api.
  and docs.onthemarket.com do not resolve, and /developers, /api, /docs,
  /openapi.json, /swagger.json and /api-docs all return 404 on the main site.
  What does exist is a member-only integration surface: the OnTheMarket Real
  Time Datafeed (RTDF), a Rightmove-RTDF-compatible feed API served from the
  live, OnTheMarket-operated host realtime-api.onthemarket.com, used by agency
  CRM vendors to push listings and pull branch enquiries on behalf of member
  agents. No machine-readable contract for it is published anywhere;
  OnTheMarket's developer guide is distributed under agreement, and every path
  on the host returns 404 to an anonymous caller. There is no RESO Web API or
  Data Dictionary certification, no OData $metadata document and no Universal
  Property Identifier anywhere in the stack — RESO is a North American
  construct and the UK has never adopted it, so "certified but unreachable"
  does not apply here; there is no certification layer in this market at all.
  OnTheMarket publishes no open data. The genuinely open UK property layer
  belongs to the public sector — HM Land Registry Price Paid Data and Ordnance
  Survey — and none of it comes from the portals. OnTheMarket's own Terms of
  Use go further than most and expressly forbid automated access to any page
  other than the home page.
